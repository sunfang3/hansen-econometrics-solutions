<!-- MathJax 3 + readable typography for Hansen solutions -->
<style>
  :root {
    --text: #1a1a1a;
    --muted: #555;
    --border: #e5e7eb;
    --bg: #ffffff;
    --code-bg: #f6f8fa;
    --accent: #0f4c81;
    --toc-bg: #f8fafc;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
      "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    max-width: 52rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  h1, h2, h3, h4 {
    font-weight: 650;
    line-height: 1.3;
    color: #111;
  }
  h1 { font-size: 1.85rem; margin-top: 2.5rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.35rem; }
  h2 { font-size: 1.4rem; margin-top: 2rem; color: var(--accent); }
  h3 { font-size: 1.15rem; margin-top: 1.5rem; }
  h1.title { border-bottom: none; font-size: 2rem; margin-top: 0; }
  p.subtitle, p.author, p.date { color: var(--muted); margin: 0.25rem 0; }
  #title-block-header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  #TOC {
    background: var(--toc-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin: 1.5rem 0 2.5rem;
  }
  #TOC > ul { padding-left: 1.2rem; }
  #TOC li { margin: 0.2rem 0; }
  #TOC a { text-decoration: none; }
  #TOC a:hover { text-decoration: underline; }
  table {
    border-collapse: collapse;
    margin: 1rem 0;
    width: 100%;
    font-size: 0.95rem;
    overflow-x: auto;
    display: block;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.4rem 0.65rem;
    text-align: left;
  }
  th { background: #f1f5f9; }
  tr:nth-child(even) td { background: #fafbfc; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    overflow-x: auto;
  }
  pre code { background: transparent; padding: 0; }
  blockquote {
    margin: 1rem 0;
    padding: 0.4rem 1rem;
    border-left: 4px solid var(--accent);
    background: #f0f7ff;
    color: #1e293b;
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
  a { color: #0369a1; }
  .math.display, mjx-container[display="true"] {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0.25rem 0;
  }
  /* chapter break cue */
  h1.chapter-title, body > h1 {
    page-break-before: always;
  }
  #title-block-header h1, body > h1:first-of-type { page-break-before: auto; }
  @media print {
    body { max-width: none; padding: 0; }
    #TOC { break-after: page; }
  }
</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    processEscapes: true,
    processEnvironments: true,
    tags: 'ams',
    packages: {'[+]': ['ams', 'noerrors', 'noundefined', 'boldsymbol']}
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
    ignoreHtmlClass: 'tex2jax_ignore|no-mathjax',
    processHtmlClass: 'tex2jax_process'
  },
  chtml: {
    scale: 1.05,
    displayAlign: 'center',
    matchFontHeight: true
  },
  startup: {
    pageReady: () => MathJax.startup.defaultPageReady().then(() => {
      document.documentElement.classList.add('mathjax-ready');
    })
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
<script>
// Fallback CDN if jsdelivr fails
window.addEventListener('error', function (e) {
  const t = e && e.target;
  if (t && t.src && t.src.indexOf('mathjax') !== -1 && t.src.indexOf('jsdelivr') !== -1) {
    const s = document.createElement('script');
    s.defer = true;
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml-full.min.js';
    document.head.appendChild(s);
  }
}, true);
</script>
